<!DOCTYPE html>
<html lang="th">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    body{
      font-family:'Prompt',sans-serif;
      background:
        linear-gradient(
          135deg,
          #f5f7fa 0%,
          #c3cfe2 100%
        );
      min-height:100vh;
    }

    .glass{
      background:
        rgba(255,255,255,.92);

      backdrop-filter:
        blur(10px);

      border:
        1px solid rgba(255,255,255,.3);
    }

    .loader{
      border-top-color:#4f46e5;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      0%{
        transform:rotate(0deg);
      }
      100%{
        transform:rotate(360deg);
      }
    }

    .badge-s{
      background:#dcfce7;
      color:#166534;
      border:2px solid #bbf7d0;
    }

    .badge-u{
      background:#fee2e2;
      color:#991b1b;
      border:2px solid #fecaca;
    }

    .badge-upskill{
      background:#dbeafe;
      color:#1e40af;
      border:2px solid #bfdbfe;
    }

    .badge-default{
      background:#f3f4f6;
      color:#374151;
      border:2px solid #e5e7eb;
    }

  </style>

</head>

<body>

<div
  class="max-w-5xl mx-auto px-4 py-10"
>

  <!-- LOGIN -->

  <div
    id="login-view"
    class="hidden flex justify-center"
  >

    <div
      class="glass p-10 rounded-3xl shadow-xl w-full max-w-sm text-center"
    >

      <div
        class="w-20 h-20 rounded-2xl bg-indigo-100 mx-auto mb-6 flex items-center justify-center"
      >

        <span
          class="text-3xl font-bold text-indigo-600"
        >
          S
        </span>

      </div>

      <h1
        class="text-3xl font-bold mb-3"
      >
        Welcome
      </h1>

      <p
        class="text-gray-500 mb-8"
      >
        Sign in to view your result
      </p>

      <button
        id="login-btn"
        class="w-full bg-indigo-600 text-white py-4 rounded-xl font-semibold hover:bg-indigo-700 transition"
      >
        Sign in with Google
      </button>

    </div>

  </div>

  <!-- MAIN -->

  <div
    id="main-view"
    class="hidden space-y-6"
  >

    <!-- TOP -->

    <div
      class="glass rounded-3xl p-5 shadow-lg flex justify-between items-center"
    >

      <div
        class="flex items-center gap-4"
      >

        <div
          id="avatar"
          class="w-14 h-14 rounded-2xl bg-indigo-500 flex items-center justify-center text-white text-2xl font-bold"
        ></div>

        <div>

          <h2
            class="font-bold text-2xl"
          >
            แดชบอร์ดผลการประเมิน
          </h2>

          <p
            id="email-display"
            class="text-gray-500"
          ></p>

        </div>

      </div>

      <div class="flex gap-2">

        <button
          id="refresh-btn"
          class="px-5 py-3 bg-indigo-50 rounded-xl text-indigo-600"
        >
          รีเฟรช
        </button>

        <button
          id="logout-btn"
          class="px-5 py-3 bg-red-50 rounded-xl text-red-600"
        >
          ออกจากระบบ
        </button>

      </div>

    </div>

    <!-- CONTENT -->

    <div
      class="glass rounded-3xl p-8 shadow-xl relative min-h-[300px]"
    >

      <!-- loading -->

      <div
        id="loading"
        class="hidden absolute inset-0 bg-white/70 rounded-3xl flex flex-col items-center justify-center"
      >

        <div
          class="loader rounded-full border-4 border-gray-100 h-12 w-12 mb-3"
        ></div>

        <p class="text-indigo-600">
          Loading...
        </p>

      </div>

      <!-- no data -->

      <div
        id="no-data"
        class="hidden py-20 text-center text-gray-400"
      >
        ไม่พบข้อมูล
      </div>

      <!-- data -->

      <div
        id="data-container"
        class="space-y-8"
      ></div>

    </div>

  </div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";

import {
  getAuth,
  signInWithPopup,
  GoogleAuthProvider,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

const firebaseConfig = {

  apiKey:
    "AIzaSyA59Z9nIWi131yg_gG4RCq90GmX9xTsRnU",

  authDomain:
    "testauthenbyappscript.firebaseapp.com",

  projectId:
    "testauthenbyappscript",

  storageBucket:
    "testauthenbyappscript.firebasestorage.app",

  messagingSenderId:
    "973927794750",

  appId:
    "1:973927794750:web:8264990c3f94fdd8cae96f"
};

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const provider =
  new GoogleAuthProvider();

const loginView =
  document.getElementById('login-view');

const mainView =
  document.getElementById('main-view');

const loading =
  document.getElementById('loading');

const noData =
  document.getElementById('no-data');

const dataContainer =
  document.getElementById('data-container');

onAuthStateChanged(auth, user => {

  if(user){

    loginView.classList.add('hidden');

    mainView.classList.remove('hidden');

    document.getElementById(
      'email-display'
    ).textContent = user.email;

    document.getElementById(
      'avatar'
    ).textContent =
      user.displayName
      ? user.displayName[0]
      : 'U';

    fetchData(user.email);

  }else{

    loginView.classList.remove('hidden');

    mainView.classList.add('hidden');
  }
});

document.getElementById(
  'login-btn'
).onclick = () => {

  signInWithPopup(auth, provider)
    .catch(err => {

      alert(
        'Login Error\n\n' +
        err.message
      );
    });
};

document.getElementById(
  'logout-btn'
).onclick = () => {

  signOut(auth);
};

document.getElementById(
  'refresh-btn'
).onclick = () => {

  if(auth.currentUser){

    fetchData(
      auth.currentUser.email
    );
  }
};

function fetchData(email){

  loading.classList.remove('hidden');

  noData.classList.add('hidden');

  dataContainer.innerHTML = '';

  google.script.run

    .withSuccessHandler(renderData)

    .withFailureHandler(err => {

      loading.classList.add('hidden');

      alert(err.message);
    })

    .getWebData(email);
}

function badgeClass(val){

  const v =
    (val || '')
      .toString()
      .toLowerCase()
      .trim();

  if(v === 's'){
    return 'badge-s';
  }

  if(v === 'u'){
    return 'badge-u';
  }

  if(v === 'upskill'){
    return 'badge-upskill';
  }

  return 'badge-default';
}

function renderData(data){

  loading.classList.add('hidden');

  if(!data || data.length === 0){

    noData.classList.remove('hidden');

    return;
  }

  dataContainer.innerHTML = '';

  data.forEach(item => {

    const card =
      document.createElement('div');

    card.innerHTML = `

      <h3
        class="text-2xl font-bold border-b pb-4 mb-8 flex items-center gap-2"
      >
        <span
          class="w-2 h-7 rounded-full bg-indigo-500"
        ></span>

        ข้อมูลของคุณ:

        <span class="text-indigo-600">
          ${item.name}
        </span>
      </h3>

      <div
        class="grid grid-cols-1 md:grid-cols-2 gap-6"
      >

        <!-- CLO1 -->

        <div
          class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm"
        >

          <h4
            class="text-center text-gray-500 font-bold mb-5"
          >
            ผลลัพธ์ CLO 1
          </h4>

          <div
            class="
              text-center
              text-4xl
              font-bold
              rounded-2xl
              py-4
              mb-6
              ${badgeClass(item.clo1)}
            "
          >
            ${item.clo1}
          </div>

          <div class="space-y-4">

            <div class="flex justify-between">
              <span>Activity 1</span>
              <span>${item.act1}</span>
            </div>

            <div class="flex justify-between">
              <span>Activity 2</span>
              <span>${item.act2}</span>
            </div>

            <div
              class="flex justify-between font-bold text-indigo-600"
            >
              <span>Total Score CLO 1</span>
              <span>${item.total1}</span>
            </div>

          </div>

        </div>

        <!-- CLO2 -->

        <div
          class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm"
        >

          <h4
            class="text-center text-gray-500 font-bold mb-5"
          >
            ผลลัพธ์ CLO 2
          </h4>

          <div
            class="
              text-center
              text-4xl
              font-bold
              rounded-2xl
              py-4
              mb-6
              ${badgeClass(item.clo2)}
            "
          >
            ${item.clo2}
          </div>

          <div class="space-y-4">

            <div class="flex justify-between">
              <span>Activity 3</span>
              <span>${item.act3}</span>
            </div>

            <div class="flex justify-between">
              <span>Activity 4</span>
              <span>${item.act4}</span>
            </div>

            <div class="flex justify-between">
              <span>Activity 5</span>
              <span>${item.act5}</span>
            </div>

            <div
              class="flex justify-between font-bold text-indigo-600"
            >
              <span>Total Score CLO 2</span>
              <span>${item.total2}</span>
            </div>

          </div>

        </div>

      </div>

    `;

    dataContainer.appendChild(card);
  });
}

</script>

</body>
</html>
